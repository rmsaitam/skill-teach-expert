[project]
name = "teach-plugin"
version = "0.1.0"
description = "Continuous personalized study plugin for coding and general topics."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Teach contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["skills/teach/scripts", "scripts"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
